<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atharva · Prep Tracker</title>
  <meta name="description" content="Track and log DSA, LLD and HLD interview preparation, with spaced-repetition revisions.">
  <meta name="theme-color" content="#090c13">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232dd4bf'/%3E%3Cstop offset='.55' stop-color='%237c9cff'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M20 46 32 16l12 30M25 35h14' stroke='%230b1020' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="locked">
  <div id="gate"></div>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark">A</span>
        <span><b>Prep Tracker</b><small>Atharva · switch prep</small></span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-route="dashboard"><i data-icon="grid"></i><span>Dashboard</span></a>
        <div class="nav-label">Tracks</div>
        <a href="#/dsa" data-route="dsa"><i class="dot" style="--c:var(--dsa)"></i><span>DSA</span><span class="count" data-count="DSA"></span></a>
        <a href="#/lld" data-route="lld"><i class="dot" style="--c:var(--lld)"></i><span>LLD</span><span class="count" data-count="LLD"></span></a>
        <a href="#/hld" data-route="hld"><i class="dot" style="--c:var(--hld)"></i><span>HLD</span><span class="count" data-count="HLD"></span></a>
        <div class="nav-label">Practice</div>
        <a href="#/revise" data-route="revise"><i data-icon="repeat"></i><span>Revise</span><span class="badge" id="nav-due"></span></a>
        <a href="#/settings" data-route="settings"><i data-icon="sliders"></i><span>Settings</span></a>
      </nav>
      <div class="sidebar-foot">
        <button class="sync-pill" id="sync-pill" data-action="sync-click" title="Sync status"></button>
        <button class="btn ghost sm lock-btn" data-action="lock" title="Lock the tracker on this device">Lock</button>
      </div>
    </aside>

    <div class="content">
      <header class="topbar">
        <div>
          <h1 id="page-title">Dashboard</h1>
          <p id="page-sub"></p>
        </div>
        <div class="top-actions">
          <button class="btn primary" data-action="new"><i data-icon="plus"></i>Log problem <kbd>N</kbd></button>
        </div>
      </header>
      <main id="main"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript><p style="padding:40px;text-align:center">This tracker needs JavaScript enabled.</p></noscript>
  <script src="data/progress.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
